
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Demo</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fafafa;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  width: 350px;
  background: white;
  border: 1px solid #ddd;
  padding: 35px 30px;
  text-align: center;
}

.logo {
  font-size: 35px;
  font-weight: bold;
  margin-bottom: 25px;
}

input {
  width: 100%;
  padding: 13px;
  margin: 6px 0;
  border: 1px solid #ddd;
  border-radius: 4px;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  background: #0095f6;
  color: white;
  border: none;
  border-radius: 7px;
  font-weight: bold;
}

.note {
  font-size: 12px;
  color: #777;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="container">
  <div class="logo">Instagram Demo</div>

  <p>Welcome to the demo page</p>

  <input type="text"
         placeholder="Demo username"
         autocomplete="off">

  <input type="text"
         placeholder="Enter a sample message"
         autocomplete="off">

  <button onclick="alert('This is a demo website!')">
    Continue
  </button>

  <div class="note">
    Independent practice project.
    Not affiliated with Instagram.
    No information is collected.
  </div>
</div>

</body>
</html>
