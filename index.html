
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Henrygram</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #fafafa;
  font-family: Arial, sans-serif;
  color: #222;
}

header {
  background: white;
  padding: 16px;
  border-bottom: 1px solid #ddd;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  color: #d62976;
}

main {
  max-width: 480px;
  margin: auto;
  padding: 15px;
}

.profile, .post, .create {
  background: white;
  border: 1px solid #ddd;
  border-radius: 10px;
  margin-bottom: 16px;
  padding: 15px;
}

.profile {
  display: flex;
  align-items: center;
  gap: 15px;
}

.avatar {
  width: 65px;
  height: 65px;
  border-radius: 50%;
  background: #e1306c;
  color: white;
  display: grid;
  place-items: center;
  font-size: 25px;
}

button {
  border: 0;
  border-radius: 7px;
  padding: 10px 15px;
  background: #e1306c;
  color: white;
  cursor: pointer;
  margin-top: 8px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 7px 0;
  border: 1px solid #ddd;
  border-radius: 7px;
}

.post img {
  width: 100%;
  max-height: 420px;
  object-fit: cover;
  margin-top: 10px;
  border-radius: 5px;
}

.post-actions {
  display: flex;
  gap: 12px;
  align-items: center;
}

.like {
  background: #f3e4eb;
  color: #d62976;
}

.comment {
  font-size: 14px;
  padding: 5px 0;
}

nav {
  position: sticky;
  bottom: 0;
  background: white;
  border-top: 1px solid #ddd;
  display: flex;
  justify-content: space-around;
  padding: 12px;
}

nav button {
  background: white;
  color: #d62976;
  font-weight: bold;
}

small { color: #777; }
</style>
</head>

<body>

<header>
  <div class="logo">Henrygram</div>
  <span>📷</span>
</header>

<main>

<section class="profile">
  <div class="avatar" id="avatar">H</div>
  <div>
    <h3 id="username">Henry</h3>
    <small>Welcome to Henrygram</small>
    <p><b id="postCount">0</b> posts · <b>0</b> followers</p>
  </div>
</section>

<section class="create" id="create">
  <h3>Create a post</h3>
  <input id="caption" placeholder="Write something...">
  <input id="photo" type="file" accept="image/*">
  <button onclick="addPost()">Share post</button>
</section>

<h3>Explore posts</h3>
<div id="feed"></div>

</main>

<nav>
  <button onclick="window.scrollTo(0,0)">🏠 Home</button>
  <button onclick="document.getElementById('create').scrollIntoView()">➕ Post</button>
  <button onclick="document.querySelector('.profile').scrollIntoView()">👤 Profile</button>
</nav>

<script>
const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();

  const telegramUser = tg.initDataUnsafe?.user;
  if (telegramUser) {
    const name = telegramUser.first_name || "Henry";
    document.getElementById("username").textContent = name;
    document.getElementById("avatar").textContent =
      name.charAt(0).toUpperCase();
  }
}

let posts = JSON.parse(localStorage.getItem("henrygram_posts") || "[]");

function savePosts() {
  localStorage.setItem("henrygram_posts", JSON.stringify(posts));
}

function renderPosts() {
  const feed = document.getElementById("feed");
  feed.innerHTML = "";

  document.getElementById("postCount").textContent = posts.length;

  posts.forEach((post, index) => {
    const div = document.createElement("div");
    div.className = "post";

    const title = document.createElement("b");
    title.textContent = post.user;
    div.appendChild(title);

    const image = document.createElement("img");
    image.src = post.image;
    image.alt = "Shared photo";
    div.appendChild(image);

    const caption = document.createElement("p");
    caption.textContent = post.caption;
    div.appendChild(caption);

    const actions = document.createElement("div");
    actions.className = "post-actions";

    const like = document.createElement("button");
    like.className = "like";
    like.textContent = "❤️ " + post.likes;
    like.onclick = () => {
      posts[index].likes++;
      savePosts();
      renderPosts();
    };

    actions.appendChild(like);
    div.appendChild(actions);

    const commentList = document.createElement("div");
    post.comments.forEach(comment => {
      const p = document.createElement("p");
      p.className = "comment";
      p.textContent = comment;
      commentList.appendChild(p);
    });
    div.appendChild(commentList);

    const commentInput = document.createElement("input");
    commentInput.placeholder = "Write a comment...";

    const commentButton = document.createElement("button");
    commentButton.textContent = "Comment";
    commentButton.onclick = () => {
      if (!commentInput.value.trim()) return;
      posts[index].comments.push(commentInput.value.trim());
      savePosts();
      renderPosts();
    };

    div.appendChild(commentInput);
    div.appendChild(commentButton);
    feed.appendChild(div);
  });
}

function addPost() {
  const file = document.getElementById("photo").files[0];
  const caption = document.getElementById("caption").value.trim();

  if (!file) {
    alert("Please select a photo first.");
    return;
  }

  if (file.size > 2 * 1024 * 1024) {
    alert("Please choose a photo smaller than 2MB.");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(event) {
    posts.unshift({
      user: document.getElementById("username").textContent,
      image: event.target.result,
      caption: caption,
      likes: 0,
      comments: []
    });

    savePosts();
    renderPosts();

    document.getElementById("caption").value = "";
    document.getElementById("photo").value = "";
    alert("Your demo post has been shared!");
  };

  reader.readAsDataURL(file);
}

renderPosts();
</script>

</body>
</html>
